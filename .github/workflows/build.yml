name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Build APK with Gradle
        run: |
          curl -sL "https://services.gradle.org/distributions/gradle-8.5-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          gradle-8.5/bin/gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload Build Log (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: List build outputs
        if: always()
        run: |
          echo "=== APK files ===" > build-report.txt
          find . -name "*.apk" -type f 2>/dev/null >> build-report.txt || true
          echo "=== Build output files ===" >> build-report.txt
          find app/build -type f 2>/dev/null | head -100 >> build-report.txt || true
          wc -l < build-report.txt

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: build-report.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/*.apk"
          if-no-files-found: warn
